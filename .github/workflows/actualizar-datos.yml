name: Actualizar datos

on:
  schedule:
    - cron: "0 9 1 * *"   # día 1 de cada mes, 06:00 de Argentina: cierra el mes anterior
  workflow_dispatch: {}   # botón «Run workflow» para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Bajar fuentes y regenerar data/auto
        run: python scripts/actualizar.py --grupo nube
      - name: Guardar cambios en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push

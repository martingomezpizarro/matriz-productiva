name: Probar acceso a portales
on: [workflow_dispatch, push]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar portales
        run: |
          for u in \
            "http://datos.energia.gob.ar/" \
            "https://datos.energia.gob.ar/" \
            "http://datos.energia.gob.ar/api/3/action/status_show" \
            "https://datos.gob.ar/api/3/action/status_show" \
            "https://datos.gob.ar/dataset/energia-produccion-petroleo-gas-por-pozo-capitulo-iv" \
            "https://www.mecon.gob.ar/dataset/Cartera-de-Proyectos-Mineros-Metaliferos-y-Litio-del-SIACAM.xlsx" \
            "https://datos.produccion.gob.ar/" \
            "https://www.argentina.gob.ar/" \
            "https://www.indec.gob.ar/" ; do
            code=$(curl -s -L -o /tmp/r -w "%{http_code} %{time_total}s %{size_download}B" -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36" "$u" || echo "FALLO")
            echo "$code  $u"
          done
          echo "IP del runner: $(curl -s https://api.ipify.org)"

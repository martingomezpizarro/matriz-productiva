name: Sondeo de fuentes
on: { push: { branches: [sondeo] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sondeo:
    if: "!contains(github.event.head_commit.message, '[resultado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas openpyxl requests yfinance
      - run: python sondeo/probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sondeo/resultado.txt && git commit -m "[resultado] sondeo" && git push

name: Mundo - explorar fuentes
on:
  push:
    branches: [mundo]
    paths: ["scripts/mundo/explorar.py", ".github/workflows/mundo-explorar.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/mundo/explorar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploracion
          git commit -m "Exploración de fuentes mundiales" || exit 0
          git push
